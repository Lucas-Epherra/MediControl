services:
  db:
    image: postgres:16-alpine
    container_name: medicontrol-db
    environment:
      POSTGRES_USER: medicontrol
      POSTGRES_PASSWORD: medicontrol
      POSTGRES_DB: medicontrol
    ports:
      - "5433:5432"
    volumes:
      - medicontrol-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medicontrol-db:
